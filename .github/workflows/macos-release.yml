name: PocketWiki macOS Release

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: pocketwiki-macos-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'release' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  release:
    name: macOS release candidate
    runs-on: macos-15
    timeout-minutes: 45
    outputs:
      release_tag: ${{ steps.version.outputs.RELEASE_TAG }}
      previous_release_tag: ${{ steps.version.outputs.PREVIOUS_RELEASE_TAG }}
      release_channel: ${{ steps.version.outputs.RELEASE_CHANNEL }}
      release_bump: ${{ steps.version.outputs.RELEASE_BUMP }}
      release_bump_reason: ${{ steps.version.outputs.RELEASE_BUMP_REASON }}
      is_prerelease: ${{ steps.version.outputs.IS_PRERELEASE }}
    env:
      POCKETWIKI_RELEASE_CHANNEL: ${{ vars.POCKETWIKI_RELEASE_CHANNEL || 'alpha' }}
      POCKETKERNEL_REF: b0453b87ba06575bb5a8187b71e5baa07a843c36

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate PocketKernel deploy key
        env:
          POCKETKERNEL_DEPLOY_KEY: ${{ secrets.POCKETKERNEL_DEPLOY_KEY }}
        run: |
          if [ -z "$POCKETKERNEL_DEPLOY_KEY" ]; then
            echo "::error::POCKETKERNEL_DEPLOY_KEY não configurada no PocketWiki."
            exit 1
          fi

      - name: Checkout PocketKernel privado
        uses: actions/checkout@v4
        with:
          repository: irinery/pocketkernel
          ref: ${{ env.POCKETKERNEL_REF }}
          path: .build/dependencies/pocketkernel
          ssh-key: ${{ secrets.POCKETKERNEL_DEPLOY_KEY }}
          persist-credentials: false

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
          cache: false

      - name: Toolchain
        run: |
          node --version
          npm --version
          swift --version
          xcodebuild -version

      - name: Dependencies
        run: npm ci --include=dev

      - name: Resolve release version
        id: version
        run: ./script/resolve_release_version.sh --github-env "$GITHUB_ENV" --github-output "$GITHUB_OUTPUT"

      - name: Configure signing
        env:
          APPLE_CODESIGN_CERTIFICATE_BASE64: ${{ secrets.APPLE_CODESIGN_CERTIFICATE_BASE64 }}
          APPLE_CODESIGN_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CODESIGN_CERTIFICATE_PASSWORD }}
          APPLE_CODESIGN_IDENTITY: ${{ secrets.APPLE_CODESIGN_IDENTITY }}
        run: |
          set -euo pipefail
          if [ -z "${APPLE_CODESIGN_CERTIFICATE_BASE64:-}" ]; then
            echo "POCKETWIKI_SIGN_MODE=adhoc" >> "$GITHUB_ENV"
            echo "Sem certificado Apple nos secrets; usando assinatura ad-hoc."
            exit 0
          fi

          if [ -z "${APPLE_CODESIGN_CERTIFICATE_PASSWORD:-}" ]; then
            echo "::error::APPLE_CODESIGN_CERTIFICATE_PASSWORD precisa existir quando APPLE_CODESIGN_CERTIFICATE_BASE64 estiver configurado."
            exit 1
          fi

          cert_path="$RUNNER_TEMP/pocketwiki-codesign.p12"
          keychain_path="$RUNNER_TEMP/pocketwiki-signing.keychain-db"
          keychain_password="$(uuidgen)"

          printf '%s' "$APPLE_CODESIGN_CERTIFICATE_BASE64" | base64 --decode > "$cert_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$cert_path" \
            -P "$APPLE_CODESIGN_CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$keychain_path" >/dev/null
          rm -f "$cert_path"

          current_keychains="$(security list-keychains -d user | tr -d '"')"
          # shellcheck disable=SC2086
          security list-keychains -d user -s "$keychain_path" $current_keychains
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$keychain_password" \
            "$keychain_path" >/dev/null

          echo "POCKETWIKI_SIGN_MODE=auto" >> "$GITHUB_ENV"
          if [ -n "${APPLE_CODESIGN_IDENTITY:-}" ]; then
            echo "POCKETWIKI_SIGNING_IDENTITY=$APPLE_CODESIGN_IDENTITY" >> "$GITHUB_ENV"
          fi
          echo "Certificado Apple carregado em keychain temporário."

      - name: Build release files
        env:
          APP_VERSION: ${{ steps.version.outputs.APP_VERSION }}
          RELEASE_TAG: ${{ steps.version.outputs.RELEASE_TAG }}
          POCKETKERNEL_SOURCE_DIR: ${{ github.workspace }}/.build/dependencies/pocketkernel
        run: ./script/build_macos_dmg.sh

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: PocketWiki-${{ steps.version.outputs.RELEASE_TAG }}-macOS
          path: dist/release/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish canonical macOS release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4

      - name: Download validated release files
        uses: actions/download-artifact@v4
        with:
          name: PocketWiki-${{ needs.release.outputs.release_tag }}-macOS
          path: dist/release

      - name: Publish canonical GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release.outputs.release_tag }}
          PREVIOUS_RELEASE_TAG: ${{ needs.release.outputs.previous_release_tag }}
          RELEASE_CHANNEL: ${{ needs.release.outputs.release_channel }}
          RELEASE_BUMP: ${{ needs.release.outputs.release_bump }}
          RELEASE_BUMP_REASON: ${{ needs.release.outputs.release_bump_reason }}
          IS_PRERELEASE: ${{ needs.release.outputs.is_prerelease }}
        run: |
          set -euo pipefail

          notes_file="$RUNNER_TEMP/pocketwiki-release-notes.md"
          {
            echo "PocketWiki $RELEASE_TAG"
            echo
            echo "Build canônica para macOS gerada após atualização da main."
            echo
            echo "- Commit: $GITHUB_SHA"
            echo "- Tag base: ${PREVIOUS_RELEASE_TAG:-nenhuma}"
            echo "- Canal: $RELEASE_CHANNEL"
            echo "- Incremento: $RELEASE_BUMP"
            echo "- Motivo: $RELEASE_BUMP_REASON"
          } > "$notes_file"

          release_flags=()
          if [ "$IS_PRERELEASE" = "true" ]; then
            release_flags+=(--prerelease)
          else
            release_flags+=(--latest)
          fi

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --title "PocketWiki $RELEASE_TAG" \
              --notes-file "$notes_file" \
              "${release_flags[@]}"
          else
            gh release create "$RELEASE_TAG" \
              --target "$GITHUB_SHA" \
              --title "PocketWiki $RELEASE_TAG" \
              --notes-file "$notes_file" \
              "${release_flags[@]}"
          fi

          gh release upload "$RELEASE_TAG" dist/release/* --clobber
