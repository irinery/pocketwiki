name: PocketWiki macOS Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  dmg:
    name: Build macOS DMG
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Toolchain
        run: |
          node --version
          npm --version
          swift --version
          xcodebuild -version

      - name: Dependencies
        run: npm ci --include=dev

      - name: Version
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "APP_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          fi

      - name: Build DMG
        run: ./script/build_macos_dmg.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PocketWiki-macOS-DMG
          path: |
            dist/release/*.dmg
            dist/release/*.dmg.sha256
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" \
              --title "PocketWiki $tag" \
              --notes "Build macOS universal assinada ad-hoc. Baixe o .dmg abaixo."
          fi
          gh release upload "$tag" dist/release/*.dmg dist/release/*.dmg.sha256 --clobber
