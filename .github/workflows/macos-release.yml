name: PocketWiki macOS Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: pocketwiki-macos-release
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish macOS release
    runs-on: macos-15
    timeout-minutes: 45
    env:
      POCKETWIKI_RELEASE_CHANNEL: ${{ vars.POCKETWIKI_RELEASE_CHANNEL || 'alpha' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Toolchain
        run: |
          node --version
          npm --version
          swift --version
          xcodebuild -version

      - name: Dependencies
        run: npm ci --include=dev

      - name: Resolve release version
        id: version
        run: ./script/resolve_release_version.sh --github-env "$GITHUB_ENV" --github-output "$GITHUB_OUTPUT"

      - name: Configure signing
        env:
          APPLE_CODESIGN_CERTIFICATE_BASE64: ${{ secrets.APPLE_CODESIGN_CERTIFICATE_BASE64 }}
          APPLE_CODESIGN_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CODESIGN_CERTIFICATE_PASSWORD }}
          APPLE_CODESIGN_IDENTITY: ${{ secrets.APPLE_CODESIGN_IDENTITY }}
        run: |
          set -euo pipefail
          if [ -z "${APPLE_CODESIGN_CERTIFICATE_BASE64:-}" ]; then
            echo "POCKETWIKI_SIGN_MODE=adhoc" >> "$GITHUB_ENV"
            echo "Sem certificado Apple nos secrets; usando assinatura ad-hoc."
            exit 0
          fi

          if [ -z "${APPLE_CODESIGN_CERTIFICATE_PASSWORD:-}" ]; then
            echo "::error::APPLE_CODESIGN_CERTIFICATE_PASSWORD precisa existir quando APPLE_CODESIGN_CERTIFICATE_BASE64 estiver configurado."
            exit 1
          fi

          cert_path="$RUNNER_TEMP/pocketwiki-codesign.p12"
          keychain_path="$RUNNER_TEMP/pocketwiki-signing.keychain-db"
          keychain_password="$(uuidgen)"

          printf '%s' "$APPLE_CODESIGN_CERTIFICATE_BASE64" | base64 --decode > "$cert_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$cert_path" \
            -P "$APPLE_CODESIGN_CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$keychain_path" >/dev/null
          rm -f "$cert_path"

          current_keychains="$(security list-keychains -d user | tr -d '"')"
          # shellcheck disable=SC2086
          security list-keychains -d user -s "$keychain_path" $current_keychains
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$keychain_password" \
            "$keychain_path" >/dev/null

          echo "POCKETWIKI_SIGN_MODE=auto" >> "$GITHUB_ENV"
          if [ -n "${APPLE_CODESIGN_IDENTITY:-}" ]; then
            echo "POCKETWIKI_SIGNING_IDENTITY=$APPLE_CODESIGN_IDENTITY" >> "$GITHUB_ENV"
          fi
          echo "Certificado Apple carregado em keychain temporário."

      - name: Build release files
        env:
          APP_VERSION: ${{ steps.version.outputs.APP_VERSION }}
          RELEASE_TAG: ${{ steps.version.outputs.RELEASE_TAG }}
        run: ./script/build_macos_dmg.sh

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: PocketWiki-${{ steps.version.outputs.RELEASE_TAG }}-macOS
          path: dist/release/*
          if-no-files-found: error
          retention-days: 7

      - name: Publish canonical GitHub release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.RELEASE_TAG }}
          PREVIOUS_RELEASE_TAG: ${{ steps.version.outputs.PREVIOUS_RELEASE_TAG }}
          RELEASE_CHANNEL: ${{ steps.version.outputs.RELEASE_CHANNEL }}
          RELEASE_BUMP: ${{ steps.version.outputs.RELEASE_BUMP }}
          RELEASE_BUMP_REASON: ${{ steps.version.outputs.RELEASE_BUMP_REASON }}
          IS_PRERELEASE: ${{ steps.version.outputs.IS_PRERELEASE }}
        run: |
          set -euo pipefail

          notes_file="$RUNNER_TEMP/pocketwiki-release-notes.md"
          {
            echo "PocketWiki $RELEASE_TAG"
            echo
            echo "Build canônica para macOS gerada após atualização da main."
            echo
            echo "- Commit: $GITHUB_SHA"
            echo "- Tag base: ${PREVIOUS_RELEASE_TAG:-nenhuma}"
            echo "- Canal: $RELEASE_CHANNEL"
            echo "- Incremento: $RELEASE_BUMP"
            echo "- Motivo: $RELEASE_BUMP_REASON"
          } > "$notes_file"

          release_flags=()
          if [ "$IS_PRERELEASE" = "true" ]; then
            release_flags+=(--prerelease)
          else
            release_flags+=(--latest)
          fi

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --title "PocketWiki $RELEASE_TAG" \
              --notes-file "$notes_file" \
              "${release_flags[@]}"
          else
            gh release create "$RELEASE_TAG" \
              --target "$GITHUB_SHA" \
              --title "PocketWiki $RELEASE_TAG" \
              --notes-file "$notes_file" \
              "${release_flags[@]}"
          fi

          gh release upload "$RELEASE_TAG" dist/release/* --clobber
