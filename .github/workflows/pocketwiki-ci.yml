name: PocketWiki CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  macos:
    name: Core and integration tests
    runs-on: macos-15
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Toolchain
        run: |
          node --version
          npm --version
          swift --version
          xcodebuild -version

      - name: CI gate
        run: ./script/ci.sh
