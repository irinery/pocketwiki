name: New Harness E1

on:
  workflow_dispatch:
  push:
    branches:
      - codex/nh-e1-integration

permissions:
  contents: read

jobs:
  linux-regression:
    name: Linux regression (Node and Go)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      POCKETKERNEL_NH00_ROOT: ${{ github.workspace }}/.build/dependencies/pocketkernel
      MIDDLEWAREAUTH_NHTEST_ROOT: ${{ github.workspace }}/.build/dependencies/middlewareAuth

    steps:
      - name: Checkout PocketWiki
        uses: actions/checkout@v4

      - name: Checkout pinned PocketKernel
        uses: actions/checkout@v4
        with:
          repository: irinery/pocketkernel
          ref: 582e216c13feb7485fa9620d9543b272ec3794b5
          path: .build/dependencies/pocketkernel
          ssh-key: ${{ secrets.POCKETKERNEL_DEPLOY_KEY }}
          persist-credentials: false

      - name: Checkout pinned MiddlewareAuth
        uses: actions/checkout@v4
        with:
          repository: irinery/middlewareAuth
          ref: 04f44f62126c785f7b28718d2eff837c28cb65df
          path: .build/dependencies/middlewareAuth

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm

      - name: Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.26.0
          cache: false

      - name: Verify environment and pinned dependencies
        run: |
          node --version
          npm --version
          go version
          command -v ps
          command -v jq
          git rev-parse HEAD
          test "$(git -C "$POCKETKERNEL_NH00_ROOT" rev-parse HEAD)" = 582e216c13feb7485fa9620d9543b272ec3794b5
          test "$(git -C "$MIDDLEWAREAUTH_NHTEST_ROOT" rev-parse HEAD)" = 04f44f62126c785f7b28718d2eff837c28cb65df

      - name: Install Node dependencies
        run: npm ci --include=dev

      - name: Run PocketWiki regression
        run: npm test

      - name: Run Node harness contracts and rig
        run: |
          node --test src/harness/contracts/validate.test.mjs src/harness/local-host.test.mjs
          npm run test:new-harness-rig

      - name: Run Kernel tests
        working-directory: .build/dependencies/pocketkernel
        run: go test ./...

      - name: Run bootstrap and interoperability checks
        run: |
          npm run test:nh00-bootstrap
          sh script/validate_pocket_interop_contract.sh

      - name: Build Linux Kernel matrix
        working-directory: .build/dependencies/pocketkernel
        env:
          NH_BUILD_DIR: ${{ runner.temp }}/pocketkernel-builds
        run: sh script/build_nh00_matrix.sh

  e0:
    name: Cumulative E1 (service, web, macOS)
    runs-on: macos-15
    timeout-minutes: 120
    env:
      POCKETKERNEL_NH00_ROOT: ${{ github.workspace }}/.build/dependencies/pocketkernel
      MIDDLEWAREAUTH_NHTEST_ROOT: ${{ github.workspace }}/.build/dependencies/middlewareAuth

    steps:
      - name: Checkout PocketWiki
        uses: actions/checkout@v4

      - name: Checkout pinned PocketKernel
        uses: actions/checkout@v4
        with:
          repository: irinery/pocketkernel
          ref: 582e216c13feb7485fa9620d9543b272ec3794b5
          path: .build/dependencies/pocketkernel
          ssh-key: ${{ secrets.POCKETKERNEL_DEPLOY_KEY }}
          persist-credentials: false

      - name: Checkout pinned MiddlewareAuth
        uses: actions/checkout@v4
        with:
          repository: irinery/middlewareAuth
          ref: 04f44f62126c785f7b28718d2eff837c28cb65df
          path: .build/dependencies/middlewareAuth

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm

      - name: Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.26.0
          cache: false

      - name: Select pinned Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          test "$(xcodegen --version)" = 'Version: 2.46.0'
          node --version
          npm --version
          go version
          swift --version
          xcodebuild -version
          xcodegen --version
          git rev-parse HEAD
          test "$(git -C "$POCKETKERNEL_NH00_ROOT" rev-parse HEAD)" = 582e216c13feb7485fa9620d9543b272ec3794b5
          test "$(git -C "$MIDDLEWAREAUTH_NHTEST_ROOT" rev-parse HEAD)" = 04f44f62126c785f7b28718d2eff837c28cb65df

      - name: Run all E1 shards
        run: node Tests/NewHarnessE2E/runner.mjs --stage E1 --surface all --report-dir "$RUNNER_TEMP/nh-test-e1"

      - name: Aggregate the complete E1 matrix
        if: success()
        run: >-
          node Tests/NewHarnessE2E/gate-aggregator.mjs --stage E1
          --target-sha "$(git rev-parse HEAD)"
          --reports "$RUNNER_TEMP/nh-test-e1/e1-all.json"
          > "$RUNNER_TEMP/nh-test-e1/gate.json"

      - name: Upload redacted E1 reports and artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nh-test-e1-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/nh-test-e1/
            !${{ runner.temp }}/nh-test-e1/**/*.xcresult
            !${{ runner.temp }}/nh-test-e1/**/*.xcresult/**
          if-no-files-found: warn
          retention-days: 14
