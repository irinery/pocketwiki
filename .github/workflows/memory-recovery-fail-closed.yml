name: Memory recovery fail-closed

on:
  push:
    branches: ['codex/memory-recovery-fail-closed']
  pull_request:
    paths:
      - 'src/memory/**'
      - 'src/harness/memory/**'
      - 'Sources/PocketWikiMac/Services/PocketMemoryStore.swift'
      - 'Tests/Harness/memory/**'
      - '.github/workflows/memory-recovery-fail-closed.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  memory:
    name: Memory recovery / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
      - name: Test memory service, preserved recovery journals and legacy regression
        run: |
          git rev-parse HEAD
          node --version
          node --test Tests/Harness/memory/service.test.mjs Tests/Harness/memory/recovery-contract.test.mjs Tests/Harness/memory/recovery-disabled.test.mjs src/memory/*.test.mjs
      - name: Test Swift commits and cross-runtime recovery rejection
        if: runner.os == 'macOS'
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          swift --version
          sh Tests/Harness/memory/run-swift-tests.sh
