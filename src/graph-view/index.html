<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PocketWiki Graph</title>
    <style>
      html,
      body,
      #graph {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #080a0d;
      }

      body {
        color: #e7edf5;
        font: 12px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        user-select: none;
      }

      #graph {
        display: block;
        touch-action: none;
      }

      #status,
      #details {
        position: fixed;
        z-index: 2;
        border: 1px solid rgba(51, 66, 86, 0.62);
        background: rgba(8, 10, 13, 0.76);
        backdrop-filter: blur(14px);
        color: rgba(231, 237, 245, 0.9);
        pointer-events: none;
      }

      #status {
        left: 12px;
        bottom: 10px;
        padding: 5px 8px;
        border-radius: 7px;
        color: rgba(147, 161, 181, 0.84);
      }

      #details {
        right: 12px;
        top: 12px;
        width: min(320px, calc(100% - 24px));
        padding: 10px 12px;
        border-radius: 8px;
      }

      #detail-title {
        font-weight: 700;
        line-height: 1.25;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      #detail-meta,
      #detail-links {
        margin-top: 4px;
        color: rgba(147, 161, 181, 0.86);
        line-height: 1.35;
      }

      #detail-links {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
    </style>
  </head>
  <body>
    <canvas id="graph"></canvas>
    <div id="status">aguardando grafo</div>
    <aside id="details" aria-live="polite">
      <div id="detail-title">Nenhum no selecionado</div>
      <div id="detail-meta"></div>
      <div id="detail-links"></div>
    </aside>
    <script src="./graph.js"></script>
  </body>
</html>
